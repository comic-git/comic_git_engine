name: Build Site

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      DEPLOY_TARGET:
        description: "`github-pages`, `neocities`, or `sftp`"
        required: false
        type: string
        default: github-pages
      OUTPUT_DIR:
        required: false
        type: string
        default: build
      ARTIFACT_RETENTION_DAYS:
        description: "Days to retain deployment artifacts (1-90). This also limits deployment-job retries."
        required: false
        type: string
        default: "1"
      CHECKOUT_EXCLUDE_PATHS:
        description: "Optional newline-separated repository-relative directories to omit from the caller checkout."
        required: false
        type: string
        default: ""
      NEOCITIES_CLEAN:
        description: "If true, will destructively delete files found on Neocities not found in your OUTPUT_DIR."
        required: false
        type: boolean
        default: true
      NEOCITIES_SUPPORTER:
        description: "Set this to true if you have a paid neocities account and want to bypass the unsupported files filter. (https://neocities.org/site_files/allowed_types)"
        required: false
        type: boolean
        default: false
      NEOCITIES_PROTECTED_FILES:
        description: "An optional glob string used to mark files as protected. Protected files are never cleaned up. Test this option out with `cleanup` set to `false` before relying on it. Protected files are printed when `cleanup` is set to true or false. Glob strings are processed by minimatch (https://github.com/isaacs/minimatch) against remote neocities file paths. Protected files can still be updated."
        required: false
        type: string
      INPUTS:
        required: false
        type: string
      SFTP_HOST:
        description: "SFTP server hostname (without a protocol or path)."
        type: string
        default: ""
      SFTP_PORT:
        type: number
        default: 22
      SFTP_REMOTE_DIR:
        description: "Existing website directory owned by this deployment, e.g. /home/username/example.com."
        type: string
        default: ""
      SFTP_CLEAN:
        description: "Delete remote files absent from the build. The destination directory belongs to comic_git."
        type: boolean
        default: true
      SFTP_HIDDEN_PATHS:
        description: "Newline-separated exact output-relative hidden files/directories to publish, e.g. .htaccess or .well-known. No globs."
        type: string
        default: ""
      SFTP_EXCLUDE_PATHS:
        description: "Newline-separated exact destination-relative files/directories to leave untouched (neither uploaded nor deleted). No globs."
        type: string
        default: ""
    secrets:
      NEOCITIES_API_TOKEN:
        required: false
      SECRETS:
        required: false
      SFTP_USERNAME:
        required: false
      SFTP_PASSWORD:
        required: false
      SFTP_PRIVATE_KEY:
        description: "Optional unencrypted OpenSSH private key, used instead of SFTP_PASSWORD."
        required: false
      SFTP_KNOWN_HOSTS:
        description: "Verified OpenSSH known_hosts entry for the server; required for either authentication method."
        required: false

jobs:
  check-parameters:
    runs-on: ubuntu-latest
    steps:
      - name: Validate DEPLOY_TARGET
        env:
          DEPLOY_TARGET: ${{ inputs.DEPLOY_TARGET }}
        run: |
          if [[ "$DEPLOY_TARGET" != "github-pages" && "$DEPLOY_TARGET" != "neocities" && "$DEPLOY_TARGET" != "sftp" ]]; then
            echo "DEPLOY_TARGET must be 'github-pages', 'neocities', or 'sftp'."
            exit 1
          fi
      - name: Check Neocities parameters
        run: |
          echo "NEOCITIES_CLEAN: ${{ inputs.NEOCITIES_CLEAN == true }}"
          echo "NEOCITIES_SUPPORTER: ${{ inputs.NEOCITIES_SUPPORTER == true }}"
      - name: Validate artifact and output settings
        env:
          ARTIFACT_RETENTION_DAYS: ${{ inputs.ARTIFACT_RETENTION_DAYS }}
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR || 'build' }}
        run: |
          if [[ ! "$ARTIFACT_RETENTION_DAYS" =~ ^([1-9]|[1-8][0-9]|90)$ ]]; then
            echo "ARTIFACT_RETENTION_DAYS must be an integer from 1 to 90."
            exit 1
          fi
          if [[ "$(realpath -m -- "$OUTPUT_DIR")" == "$(realpath -m -- "$GITHUB_WORKSPACE")" ]]; then
            echo "OUTPUT_DIR must be a separate directory, not the checkout root."
            exit 1
          fi

  build:
    needs: check-parameters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout caller repo
        if: ${{ inputs.CHECKOUT_EXCLUDE_PATHS == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          submodules: false

      - name: Sparse checkout caller repo
        if: ${{ inputs.CHECKOUT_EXCLUDE_PATHS != '' }}
        shell: bash
        env:
          CHECKOUT_EXCLUDE_PATHS: ${{ inputs.CHECKOUT_EXCLUDE_PATHS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          patterns = ["/*"]
          for raw in os.environ["CHECKOUT_EXCLUDE_PATHS"].splitlines():
              if not raw.strip():
                  continue
              path = raw.rstrip("\r")
              parts = path.split("/")
              if (path != path.strip() or path.startswith("/") or path.endswith("/")
                      or any(part in ("", ".", "..") for part in parts)
                      or parts[0] in (".git", ".github")
                      or any(char in path for char in "\\*?[]!#:")
                      or any(ord(char) < 32 or ord(char) == 127 for char in path)):
                  raise SystemExit(f"Invalid CHECKOUT_EXCLUDE_PATHS directory: {path!r}")
              patterns.append(f"!/{path}/")
          if len(patterns) == 1:
              raise SystemExit("CHECKOUT_EXCLUDE_PATHS must name at least one directory")
          Path(os.environ["RUNNER_TEMP"], "comic-git-sparse-patterns").write_text(
              "\n".join(patterns) + "\n", encoding="utf-8"
          )
          PY
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          patterns = Path(os.environ["RUNNER_TEMP"], "comic-git-sparse-patterns").read_text(
              encoding="utf-8"
          ).splitlines()[1:]
          for pattern in patterns:
              path = pattern[2:-1]
              result = subprocess.run(
                  ["git", "cat-file", "-t", f"FETCH_HEAD:{path}"],
                  capture_output=True, text=True,
              )
              if result.returncode or result.stdout.strip() != "tree":
                  raise SystemExit(f"CHECKOUT_EXCLUDE_PATHS is not a directory: {path!r}")
          PY
          git sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/comic-git-sparse-patterns"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            checkout --detach FETCH_HEAD

      - name: Read engine version
        id: engine
        shell: python
        run: |
          from configparser import RawConfigParser
          from pathlib import Path
          import tomllib
          import os

          DEFAULT_ENGINE_VERSION = "1.1"

          toml_path = Path("your_content/comic_info.toml")
          ini_path = Path("your_content/comic_info.ini")

          if toml_path.exists():
              data = tomllib.loads(toml_path.read_text(encoding="utf-8"))
              engine = data.get("engine", {})
              if not isinstance(engine, dict):
                  raise SystemExit("Expected engine in comic_info.toml to be a table")
              version = engine.get("version", DEFAULT_ENGINE_VERSION)
              if not isinstance(version, str):
                  raise SystemExit("Expected engine.version in comic_info.toml to be a string")
          elif ini_path.exists():
              parser = RawConfigParser()
              parser.optionxform = str
              parser.read(ini_path, encoding="utf-8")
              version = parser.get("Comic Settings", "Engine version", fallback=DEFAULT_ENGINE_VERSION)
          else:
              raise SystemExit("Expected your_content/comic_info.toml or your_content/comic_info.ini")

          version = version.strip() or DEFAULT_ENGINE_VERSION
          if "\n" in version or "\r" in version:
              raise ValueError("Engine version must be a single-line Git ref")
          print(f"Engine version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      - name: Checkout comic engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          repository: comic-git/comic_git_engine
          ref: ${{ steps.engine.outputs.version }}
          path: comic_git_engine

      - name: Install dependencies
        run: |
          pip install -r comic_git_engine/requirements.txt
          python comic_git_engine/src/scripts/make_requirements_hooks_file.py
          pip install -c comic_git_engine/requirements.txt -r comic_git_engine/requirements_hooks.txt

      - name: Run python build script
        env:
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR || 'build' }}
          INPUTS: ${{ inputs.INPUTS }}
          SECRETS: ${{ secrets.SECRETS }}
          DEPLOY_TARGET: ${{ inputs.DEPLOY_TARGET }}
          SFTP_HIDDEN_PATHS: ${{ inputs.SFTP_HIDDEN_PATHS }}
          SFTP_HOST: ${{ inputs.SFTP_HOST }}
          SFTP_PORT: ${{ inputs.SFTP_PORT }}
          SFTP_REMOTE_DIR: ${{ inputs.SFTP_REMOTE_DIR }}
          SFTP_CLEAN: ${{ inputs.SFTP_CLEAN }}
          SFTP_EXCLUDE_PATHS: ${{ inputs.SFTP_EXCLUDE_PATHS }}
          SFTP_DEPLOY_DIR: ${{ runner.temp }}/sftp-deployment
        run: |
          build_args=(--delete-scheduled-posts)
          if [[ "$DEPLOY_TARGET" == "sftp" ]]; then
            build_args+=(--hidden-paths "$SFTP_HIDDEN_PATHS")
            build_args+=(--sftp-deploy-dir "$SFTP_DEPLOY_DIR")
          fi
          python comic_git_engine/src/build/build_site.py "${build_args[@]}"
          python_exit_code=$?
          echo "python script exit code: $python_exit_code"
          if [ $python_exit_code -ne 0 ]; then
            exit $python_exit_code
          fi

      - name: Verify generated output
        env:
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR || 'build' }}
        run: |
          if [[ ! -d "$OUTPUT_DIR" ]]; then
            echo "Missing generated output directory: $OUTPUT_DIR"
            exit 1
          fi

      - name: Upload Pages artifact
        if: ${{ inputs.DEPLOY_TARGET == 'github-pages' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # actions/upload-pages-artifact@v4.0.0
        with:
          path: ${{ inputs.OUTPUT_DIR || 'build' }}
          retention-days: ${{ inputs.ARTIFACT_RETENTION_DAYS }}

      - name: Upload build artifact
        if: ${{ inputs.DEPLOY_TARGET == 'neocities' || inputs.DEPLOY_TARGET == 'sftp' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || 'build' }}
          include-hidden-files: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
          if-no-files-found: error
          retention-days: ${{ inputs.ARTIFACT_RETENTION_DAYS }}

      - name: Upload SFTP deployment files
        if: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: sftp-deployment
          path: ${{ runner.temp }}/sftp-deployment
          if-no-files-found: error
          retention-days: ${{ inputs.ARTIFACT_RETENTION_DAYS }}

  deploy-github-pages:
    if: ${{ inputs.DEPLOY_TARGET == 'github-pages' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4

  deploy-neocities:
    if: ${{ inputs.DEPLOY_TARGET == 'neocities' }}
    needs: build
    environment:
      name: neocities

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || 'build' }}

      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@44e42387b3267e31432ca34b01f013b94956f2f2 # bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: ${{ inputs.OUTPUT_DIR || 'build' }}
          cleanup: ${{ inputs.NEOCITIES_CLEAN }}
          neocities_supporter: ${{ inputs.NEOCITIES_SUPPORTER }}
          preview_before_deploy: true
          protected_files: ${{ inputs.NEOCITIES_PROTECTED_FILES }}

  deploy-sftp:
    if: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
    needs: build
    environment:
      name: sftp
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || 'build' }}

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Download SFTP deployment files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: sftp-deployment
          path: ${{ runner.temp }}/sftp-deployment

      - name: Deploy via SFTP
        env:
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR || 'build' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: python "$RUNNER_TEMP/sftp-deployment/deploy.py" --output-dir "$OUTPUT_DIR"
