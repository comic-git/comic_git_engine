name: Build Site

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      DEPLOY_TARGET:
        description: "`github-pages`, `neocities`, or `sftp`"
        required: false
        type: string
        default: github-pages
      OUTPUT_DIR:
        required: false
        type: string
        default: build
      NEOCITIES_CLEAN:
        description: "If true, will destructively delete files found on Neocities not found in your OUTPUT_DIR."
        required: false
        type: boolean
        default: true
      NEOCITIES_SUPPORTER:
        description: "Set this to true if you have a paid neocities account and want to bypass the unsupported files filter. (https://neocities.org/site_files/allowed_types)"
        required: false
        type: boolean
        default: false
      NEOCITIES_PROTECTED_FILES:
        description: "An optional glob string used to mark files as protected. Protected files are never cleaned up. Test this option out with `cleanup` set to `false` before relying on it. Protected files are printed when `cleanup` is set to true or false. Glob strings are processed by minimatch (https://github.com/isaacs/minimatch) against remote neocities file paths. Protected files can still be updated."
        required: false
        type: string
      INPUTS:
        required: false
        type: string
      SFTP_HOST:
        description: "SFTP server hostname (without a protocol or path)."
        type: string
        default: ""
      SFTP_PORT:
        type: number
        default: 22
      SFTP_REMOTE_DIR:
        description: "Existing website directory owned by this deployment, e.g. /home/username/example.com."
        type: string
        default: ""
      SFTP_CLEAN:
        description: "Delete remote files absent from the build. The destination directory belongs to comic_git."
        type: boolean
        default: true
      SFTP_HIDDEN_PATHS:
        description: "Newline-separated exact output-relative hidden files/directories to publish, e.g. .htaccess or .well-known. No globs."
        type: string
        default: ""
      SFTP_EXCLUDE_PATHS:
        description: "Newline-separated exact destination-relative files/directories to leave untouched (neither uploaded nor deleted). No globs."
        type: string
        default: ""
    secrets:
      NEOCITIES_API_TOKEN:
        required: false
      SECRETS:
        required: false
      SFTP_USERNAME:
        required: false
      SFTP_PASSWORD:
        required: false
      SFTP_PRIVATE_KEY:
        description: "Optional unencrypted OpenSSH private key, used instead of SFTP_PASSWORD."
        required: false
      SFTP_KNOWN_HOSTS:
        description: "Verified OpenSSH known_hosts entry for the server; required for either authentication method."
        required: false

jobs:
  check-parameters:
    runs-on: ubuntu-latest
    steps:
      - name: Validate DEPLOY_TARGET
        env:
          DEPLOY_TARGET: ${{ inputs.DEPLOY_TARGET }}
        run: |
          if [[ "$DEPLOY_TARGET" != "github-pages" && "$DEPLOY_TARGET" != "neocities" && "$DEPLOY_TARGET" != "sftp" ]]; then
            echo "DEPLOY_TARGET must be 'github-pages', 'neocities', or 'sftp'."
            exit 1
          fi
      - name: Check Neocities parameters
        run: |
          echo "NEOCITIES_CLEAN: ${{ inputs.NEOCITIES_CLEAN == true }}"
          echo "NEOCITIES_SUPPORTER: ${{ inputs.NEOCITIES_SUPPORTER == true }}"

  build:
    needs: check-parameters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read engine version
        id: engine
        shell: python
        run: |
          from configparser import RawConfigParser
          from pathlib import Path
          import tomllib
          import os

          DEFAULT_ENGINE_VERSION = "1.1"

          toml_path = Path("your_content/comic_info.toml")
          ini_path = Path("your_content/comic_info.ini")

          if toml_path.exists():
              data = tomllib.loads(toml_path.read_text(encoding="utf-8"))
              engine = data.get("engine", {})
              if not isinstance(engine, dict):
                  raise SystemExit("Expected engine in comic_info.toml to be a table")
              version = engine.get("version", DEFAULT_ENGINE_VERSION)
              if not isinstance(version, str):
                  raise SystemExit("Expected engine.version in comic_info.toml to be a string")
          elif ini_path.exists():
              parser = RawConfigParser()
              parser.optionxform = str
              parser.read(ini_path, encoding="utf-8")
              version = parser.get("Comic Settings", "Engine version", fallback=DEFAULT_ENGINE_VERSION)
          else:
              raise SystemExit("Expected your_content/comic_info.toml or your_content/comic_info.ini")

          version = version.strip() or DEFAULT_ENGINE_VERSION
          if "\n" in version or "\r" in version:
              raise ValueError("Engine version must be a single-line Git ref")
          print(f"Engine version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      - name: Checkout comic engine
        uses: actions/checkout@v4
        with:
          repository: comic-git/comic_git_engine
          ref: ${{ steps.engine.outputs.version }}
          path: comic_git_engine

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r comic_git_engine/requirements.txt
          python comic_git_engine/src/scripts/make_requirements_hooks_file.py
          pip install -r comic_git_engine/requirements_hooks.txt

      - name: Run python build script
        env:
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR }}
          INPUTS: ${{ inputs.INPUTS }}
          SECRETS: ${{ secrets.SECRETS }}
          DEPLOY_TARGET: ${{ inputs.DEPLOY_TARGET }}
          SFTP_HIDDEN_PATHS: ${{ inputs.SFTP_HIDDEN_PATHS }}
          SFTP_HOST: ${{ inputs.SFTP_HOST }}
          SFTP_PORT: ${{ inputs.SFTP_PORT }}
          SFTP_REMOTE_DIR: ${{ inputs.SFTP_REMOTE_DIR }}
          SFTP_CLEAN: ${{ inputs.SFTP_CLEAN }}
          SFTP_EXCLUDE_PATHS: ${{ inputs.SFTP_EXCLUDE_PATHS }}
          SFTP_DEPLOY_DIR: ${{ runner.temp }}/sftp-deployment
        run: |
          build_args=(--delete-scheduled-posts)
          if [[ "$DEPLOY_TARGET" == "sftp" ]]; then
            build_args+=(--hidden-paths "$SFTP_HIDDEN_PATHS")
            build_args+=(--sftp-deploy-dir "$SFTP_DEPLOY_DIR")
          fi
          python comic_git_engine/src/build/build_site.py "${build_args[@]}"
          python_exit_code=$?
          echo "python script exit code: $python_exit_code"
          if [ $python_exit_code -ne 0 ]; then
            exit $python_exit_code
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || '.' }}
          include-hidden-files: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
          if-no-files-found: error

      - name: Upload SFTP deployment files
        if: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
        uses: actions/upload-artifact@v4
        with:
          name: sftp-deployment
          path: ${{ runner.temp }}/sftp-deployment
          if-no-files-found: error

  deploy-github-pages:
    if: ${{ inputs.DEPLOY_TARGET == 'github-pages' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || '.' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.OUTPUT_DIR || '.' }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-neocities:
    if: ${{ inputs.DEPLOY_TARGET == 'neocities' }}
    needs: build
    environment:
      name: neocities

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || '.' }}

      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: ${{ inputs.OUTPUT_DIR || '.' }}
          cleanup: ${{ inputs.NEOCITIES_CLEAN }}
          neocities_supporter: ${{ inputs.NEOCITIES_SUPPORTER }}
          preview_before_deploy: true
          protected_files: ${{ inputs.NEOCITIES_PROTECTED_FILES }}

  deploy-sftp:
    if: ${{ inputs.DEPLOY_TARGET == 'sftp' }}
    needs: build
    environment:
      name: sftp
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ inputs.OUTPUT_DIR || '.' }}

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Download SFTP deployment files
        uses: actions/download-artifact@v4
        with:
          name: sftp-deployment
          path: ${{ runner.temp }}/sftp-deployment

      - name: Deploy via SFTP
        env:
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: python "$RUNNER_TEMP/sftp-deployment/deploy.py" --output-dir "$OUTPUT_DIR"
